name: hiiisiii bootstrap e2e

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: hiiisiii-bootstrap-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.repository.private == true &&
      github.actor == 'hiiisiii' &&
      startsWith(github.event.issue.title, '[hiiisiii-bootstrap]')
    runs-on: [self-hosted, linux, ARM64, hiiisiii-e2e]
    timeout-minutes: 5

    steps:
      - name: Confirm runner transport
        shell: bash
        run: |
          set -euo pipefail
          echo "hiiisiii bootstrap reached self-hosted runner"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "run_id=${GITHUB_RUN_ID}"

      - name: Publish bootstrap result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"body":"<!-- hiiisiii-bootstrap-result -->\\nBootstrap E2E success. run_id=%s"}' "$RUN_ID")
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data "$payload" > /dev/null
